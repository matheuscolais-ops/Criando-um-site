<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matheus Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            color: #333;
        }

        header {
            background-color: #111;
            color: #fff;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .cart-icon-container {
            position: relative;
            cursor: pointer;
            background: #e67e22;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
        }

        .cart-count {
            background-color: #fff;
            color: #e67e22;
            border-radius: 50%;
            padding: 2px 7px;
            font-size: 14px;
            margin-left: 5px;
        }

        .banner {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://unsplash.com') no-repeat center center/cover;
            height: 250px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        /* Alinhamento das camisas uma ao lado da outra */
        .products-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .product-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 260px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .product-card img {
            max-width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #444;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 15px;
        }

        .btn-buy {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-buy:hover {
            background-color: #219653;
        }

        /* Menu Lateral do Carrinho */
        .cart-sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100%;
            background: #fff;
            box-shadow: -5px 0 15px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 2000;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .cart-sidebar.active {
            right: 0;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .close-cart {
            font-size: 24px;
            cursor: pointer;
            background: none;
            border: none;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .cart-total {
            border-top: 2px solid #eee;
            padding-top: 15px;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .btn-checkout {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .cart-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 1500;
        }

        .cart-overlay.active {
            display: block;
        }

        footer {
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Matheus Store</div>
        <div class="cart-icon-container" id="cart-icon">
            🛒 Carrinho <span class="cart-count" id="cart-count">0</span>
        </div>
    </header>

    <section class="banner">
        <h1>Matheus Store</h1>
        <p>Melhor loja de video games</p>
    </section>

    <div class="container">
        <h2 class="section-title">Nossos Produtos</h2>
        
        <div class="products-grid">
            <div class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQsewg2LSVteJUOGbCQm173wGlrUR27F2Igf_uqFJ2ClA&s=10" alt="Ps5">
                <h3>Play station 5</h3>
                <div class="product-price">R$ 4000</div>
                <button class="btn-buy" onclick="addToCart('Camisa Branca Básica', 59.90)">Comprar</button>
            </div>

            <div class="product-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT_R2ShG43VUXhAFQoM4mbK6SeZ7W79nlz-CUq834bKMw&s" alt="nintendo 2"
                <h3>nintendo switch 2</h3>
                <div class="product-price">R$ 3000</div>
                <button class="btn-buy" onclick="addToCart('Camisa Preta Premium', 69.90)">Comprar</button>
            </div>

            <div class="product-card">
                <img src="https://cms-assets.xboxservices.com/assets/bc/40/bc40fdf3-85a6-4c36-af92-dca2d36fc7e5.png?n=642227_Hero-Gallery-0_A1_857x676.png" alt="Xbox x">
                <h3>Xbox series x</h3>
                <div class="product-price">R$ 4500</div>
                <button class="btn-buy" onclick="addToCart('Camisa Casual Cinza', 79.90)">Comprar</button>
            </div>

            <div class="product-card">
                <img src="https://images.tcdn.com.br/img/img_prod/740836/oculos_de_realidade_virtual_vr_conjunto_fone_de_ouvido_realidade_virtual_quest_2_de_128_gb_24207_1_28e5804fe927629e58300426461d7be9.png" alt="Oculos vr">
                <h3>Oculos VR</h3>
                <div class="product-price">R$ 3000</div>
                <button class="btn-buy" onclick="addToCart('Camisa Estampa Floral', 89.90)">Comprar</button>
            </div>
        </div>
    </div>

    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Seu Carrinho</h3>
            <button class="close-cart" id="close-cart">&times;</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-total">
            <span>Total:</span>
            <span id="cart-total-value">R$ 0,00</span>
        </div>
        <button class="btn-checkout" onclick="checkout()">Finalizar Compra</button>
    </div>

    <footer>
        <p>&copy; 2026 Matheus Store. Todos os direitos reservados.</p>
    </footer>

    <script>
        let cart = [];

        const cartIcon = document.getElementById('cart-icon');
        const cartSidebar = document.getElementById('cart-sidebar');
        const cartOverlay = document.getElementById('cart-overlay');
        const closeCart = document.getElementById('close-cart');
        const cartItemsContainer = document.getElementById('cart-items');
        const cartCount = document.getElementById('cart-count');
        const cartTotalValue = document.getElementById('cart-total-value');

        cartIcon.addEventListener('click', () => {
            cartSidebar.classList.add('active');
            cartOverlay.classList.add('active');
        });

        function closeCartFunc() {
            cartSidebar.classList.remove('active');
            cartOverlay.classList.remove('active');
        }

        closeCart.addEventListener('click', closeCartFunc);
        cartOverlay.addEventListener('click', closeCartFunc);

        function addToCart(name, price) {
            const existingItem = cart.find(item => item.name === name);
            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ name, price, quantity: 1 });
            }
            updateCartUI();
            cartSidebar.classList.add('active');
            cartOverlay.classList.add('active');
        }
